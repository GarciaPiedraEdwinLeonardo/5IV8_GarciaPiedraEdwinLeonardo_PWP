<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Parte 2</title>
    <link rel="shortcut icon" href="./../../icon/icon-page.png" type="image/x-icon">
    <link rel="stylesheet" href="./../../css/fonts.css">
    <link rel="stylesheet" href="./../css/style.css">
</head>
<body>
    
    <div class="container-back">
        <a href="./../ejercicios2.html">Regresar a la principal</a>
    </div>

    <form method="post">

        <div class="title-container">
            <h1>Calculo de utilidades</h1>
        </div>

        <div class="input-container">

            <div class="campo">
                <label>Ingrese el sueldo que gana mensualmente</label>
                <input type="text" id="sueldo" onkeypress="return validarTeclado(event)">
            </div>

            <div class="campo">
                <label>Ingrese su antiguedad en la empresa</label>
                <input type="text" id="antiguedad" onkeypress="return validarTecladoA(event)">
            </div>

            <div class="button">
                <input type="button" onclick="calcularUtilidad()" value="Calcular">
                <input type="button" onclick="clean()" value="Limpiar">
            </div>

        </div>

        <div class="result-container">

            <div class="result">
                <label>Utilidad correspondiente</label>
                <input type="text" readonly id="utilidad">
            </div>

        </div>

    </form>

    <script src="./../js/ej4.js"></script>

</body>
</html>
