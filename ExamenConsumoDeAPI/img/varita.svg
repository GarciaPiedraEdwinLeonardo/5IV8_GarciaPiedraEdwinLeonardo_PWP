<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <circle cx="200" cy="200" r="180" fill="#0c1a33" stroke="#d4af37" stroke-width="4"/>
  
  <!-- Varita -->
  <rect x="195" y="100" width="10" height="180" rx="5" fill="#8b4513"/>
  <rect x="195" y="100" width="10" height="30" rx="5" fill="#d4af37"/>
  
  <!-- Efecto mágico -->
  <path d="M 200 90 Q 180 60 200 30 Q 220 60 200 90" fill="#d4af37" opacity="0.7"/>
  <circle cx="200" cy="50" r="15" fill="#d4af37" opacity="0.5"/>
  
  <!-- Partículas -->
  <circle cx="170" cy="120" r="2" fill="#d4af37"/>
  <circle cx="230" cy="150" r="3" fill="#d4af37"/>
  <circle cx="180" cy="180" r="2" fill="#d4af37"/>
  <circle cx="220" cy="200" r="2" fill="#d4af37"/>
  
  <!-- Texto -->
  <text x="200" y="320" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="16">
    Apunta y nombra
  </text>
  <text x="200" y="340" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="14">
    un mago para comenzar
  </text>
</svg>