<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="400" fill="#1e3a5f"/>
  
  <!-- Varita rota -->
  <line x1="120" y1="120" x2="280" y2="280" stroke="#8b0000" stroke-width="8" stroke-linecap="round"/>
  <line x1="280" y1="120" x2="120" y2="280" stroke="#8b0000" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Efecto mágico roto -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Texto principal -->
  <text x="200" y="120" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="48" font-weight="bold">
    404
  </text>
  
  <!-- Mensaje -->
  <text x="200" y="160" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="16">
    ¡Hechizo fallido!
  </text>
  
  <text x="200" y="300" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="14">
    El mago no se encuentra
  </text>
  <text x="200" y="320" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="14">
    en los registros mágicos
  </text>
  
  <!-- Estrellas caídas -->
  <text x="100" y="250" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="20">✦</text>
  <text x="300" y="350" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="20">✦</text>
  <text x="350" y="200" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="15">✦</text>
</svg>