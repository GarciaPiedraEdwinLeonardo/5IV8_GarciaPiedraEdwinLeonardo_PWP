<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .book { animation: float 2s ease-in-out infinite; }
    .sparkle { animation: sparkle 1.5s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
  
  <!-- Libro -->
  <rect x="60" y="70" width="80" height="100" rx="5" fill="#8b0000" class="book"/>
  <rect x="65" y="75" width="70" height="90" rx="3" fill="#1e3a5f"/>
  <line x1="65" y1="95" x2="135" y2="95" stroke="#d4af37" stroke-width="1"/>
  <line x1="65" y1="115" x2="135" y2="115" stroke="#d4af37" stroke-width="1"/>
  <line x1="65" y1="135" x2="135" y2="135" stroke="#d4af37" stroke-width="1"/>
  
  <!-- Partículas mágicas -->
  <circle cx="50" cy="50" r="3" fill="#d4af37" class="sparkle" style="animation-delay: 0s"/>
  <circle cx="150" cy="60" r="2" fill="#d4af37" class="sparkle" style="animation-delay: 0.5s"/>
  <circle cx="80" cy="40" r="2" fill="#d4af37" class="sparkle" style="animation-delay: 1s"/>
  <circle cx="120" cy="30" r="3" fill="#d4af37" class="sparkle" style="animation-delay: 0.2s"/>
  
  <text x="100" y="180" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="12">
    Buscando...
  </text>
</svg>